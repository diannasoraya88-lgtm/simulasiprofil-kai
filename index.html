<style>
:root{--navy:#142B45;--blue:#1E3F66;--orange:#F58220;--red:#E52429;--bg:#fff;--bg2:#F4F6F8;--text:#1c2733;--muted:#5b6b7b;--card:#fff;--line:#dfe5ec;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="light"]){color-scheme:light}
html{scroll-padding-top:80px;scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 Inter,'Open Sans',Arial,sans-serif}
h1,h2,h3,h4{font-family:Poppins,Arial,sans-serif;color:var(--navy);line-height:1.25;margin:0 0 .5em}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--navy);color:#fff}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--navy);z-index:30}
.nav{display:flex;align-items:center;justify-content:space-between;gap:12px;height:64px}
.logo{font:700 22px Poppins;color:#fff;letter-spacing:.5px;cursor:pointer;white-space:nowrap}
.logo span{color:var(--orange)}
nav{display:flex;gap:4px;align-items:center}
nav a{color:#dbe6f2;text-decoration:none;padding:8px 11px;border-radius:6px;font-size:14px;font-weight:500;cursor:pointer;transition:.2s}
nav a:hover,nav a.on{background:rgba(255,255,255,.12);color:#fff}
nav a.on{box-shadow:inset 0 -3px 0 var(--orange)}
.lang{display:flex;border:1px solid rgba(255,255,255,.4);border-radius:6px;overflow:hidden}
.lang button{background:none;border:0;color:#fff;padding:6px 10px;font:600 12px Inter;cursor:pointer}
.lang button.on{background:var(--orange)}
.burger{display:none;background:none;border:0;color:#fff;font-size:26px;cursor:pointer}
@media(max-width:900px){.burger{display:block}nav{display:none;position:absolute;top:64px;left:0;right:0;background:var(--navy);flex-direction:column;align-items:stretch;padding:10px 20px 16px}nav.open{display:flex}.nav{position:relative}.right{display:flex;align-items:center;gap:8px}}
.right{display:flex;align-items:center;gap:8px}
.page{display:none;animation:fade .4s}
.page.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{display:inline-block;background:var(--blue);color:#fff;border:0;padding:11px 22px;border-radius:8px;font:600 14px Inter;text-decoration:none;cursor:pointer;transition:.2s}
.btn:hover{background:#0d1e32;transform:translateY(-2px)}
.btn.o{background:var(--orange)}.btn.o:hover{background:#d96e10}
.btn.g{background:transparent;border:2px solid #fff}.btn.g:hover{background:rgba(255,255,255,.15)}
.btn.s{padding:7px 14px;font-size:13px}
.hero{background:linear-gradient(120deg,rgba(20,43,69,.93),rgba(30,63,102,.82)),repeating-linear-gradient(90deg,#142B45 0 40px,#1a3656 40px 80px);color:#fff;padding:110px 0 100px;position:relative;overflow:hidden}
.hero h1{color:#fff;font-size:clamp(30px,5vw,52px);max-width:760px}
.hero p{max-width:640px;color:#dbe6f2;font-size:18px}
.hero .rail{position:absolute;left:0;right:0;bottom:0;height:8px;background:linear-gradient(90deg,var(--orange) 50%,#fff 50%)}
.hero .note{font-size:12px;opacity:.7;margin-top:28px}
section{padding:64px 0}
section.alt{background:var(--bg2)}
.kicker{color:var(--orange);font:600 13px Poppins;letter-spacing:2px;text-transform:uppercase}
.pagehead{background:var(--navy);color:#fff;padding:56px 0}
.pagehead h1{color:#fff;margin:0;font-size:clamp(26px,4vw,40px)}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:.25s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(20,43,69,.14)}
.card .b{padding:18px;display:flex;flex-direction:column;gap:8px;flex:1}
.card .b p{margin:0;color:var(--muted);font-size:14.5px;flex:1}
.ph{aspect-ratio:16/10;display:flex;align-items:center;justify-content:center;position:relative;background:linear-gradient(135deg,var(--blue),var(--navy))}
.ph.c1{background:linear-gradient(135deg,#1E3F66,#142B45)}.ph.c2{background:linear-gradient(135deg,#F58220,#b85a0a)}.ph.c3{background:linear-gradient(135deg,#142B45,#3a5a7e)}.ph.c4{background:linear-gradient(135deg,#F58220,#142B45)}
.ph svg{width:38%;opacity:.9}
.ph img+small{background:rgba(20,43,69,.78);padding:2px 9px;border-radius:12px;opacity:1;bottom:8px;right:8px}
.ph small{position:absolute;bottom:6px;right:8px;color:#fff;opacity:.75;font-size:11px}
.tag{display:inline-block;font-size:11px;font-weight:600;background:#fff2e5;color:#b85a0a;padding:2px 9px;border-radius:20px;width:fit-content}
.meta{font-size:12px;color:var(--muted)}
.two{display:grid;gap:32px;grid-template-columns:1fr 1fr}
@media(max-width:760px){.two{grid-template-columns:1fr}section{padding:44px 0}}
.stats{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.stat{background:#fff;border:1px dashed var(--blue);border-radius:12px;padding:22px;text-align:center}
.stat b{display:block;font:700 22px Poppins;color:var(--blue)}
.ph-txt{background:#fff8e6;border-left:4px solid var(--orange);padding:2px 8px;border-radius:3px;font-size:.92em}
.tl{border-left:3px solid var(--blue);margin-left:8px;padding-left:24px}
.tl div{position:relative;margin-bottom:26px}
.tl div::before{content:"";position:absolute;left:-33px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--orange);border:3px solid #fff;box-shadow:0 0 0 2px var(--blue)}
.tl b{font-family:Poppins;color:var(--blue)}
.vals{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.val{background:#fff;border-top:4px solid var(--orange);border-radius:10px;padding:16px;border:1px solid var(--line);border-top:4px solid var(--orange)}
.val b{font-family:Poppins;color:var(--navy)}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.tabs button{border:1px solid var(--blue);background:#fff;color:var(--blue);padding:7px 15px;border-radius:20px;font:600 13px Inter;cursor:pointer;transition:.2s}
.tabs button.on,.tabs button:hover{background:var(--blue);color:#fff}
.photo{cursor:zoom-in}
.lb{position:fixed;inset:0;background:rgba(10,20,34,.92);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.lb.on{display:flex}
.lb .in{width:min(860px,100%);color:#fff;text-align:center}
.lb .ph{border-radius:12px}
.lb button{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));right:18px;background:none;border:0;color:#fff;font-size:34px;cursor:pointer}
.vid{aspect-ratio:16/9;background:#0e1c2e;display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;text-align:center;padding:12px}
.vid iframe{width:100%;height:100%;border:0}
.org{display:flex;flex-direction:column;align-items:center;gap:14px}
.node{background:#fff;border:2px solid var(--blue);border-radius:10px;padding:12px 22px;text-align:center;font-weight:600;color:var(--navy);min-width:200px}
.node.top{background:var(--navy);color:#fff;border-color:var(--navy)}
.node small{display:block;font-weight:400;color:var(--muted)}
.node.top small{color:#b8c8da}
.line{width:2px;height:22px;background:var(--blue)}
.row{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
.cbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px}
.cbox h4{margin-bottom:4px}
.map{aspect-ratio:16/9;border-radius:12px;background:repeating-linear-gradient(45deg,#e7edf3 0 14px,#f0f4f8 14px 28px);display:flex;align-items:center;justify-content:center;color:var(--muted);text-align:center;padding:16px;border:1px solid var(--line)}
footer{background:var(--navy);color:#c5d3e2;padding:48px 0 24px;font-size:14px}
footer h4{color:#fff;font-size:15px}
footer a{color:#c5d3e2;text-decoration:none;cursor:pointer;display:block;padding:2px 0}
footer a:hover{color:var(--orange)}
.disc{border-top:1px solid rgba(255,255,255,.18);margin-top:26px;padding-top:18px;font-size:13px;color:#fff}
#top{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--orange);color:#fff;border:0;width:44px;height:44px;border-radius:50%;font-size:20px;cursor:pointer;display:none;z-index:15;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.sim{background:#fff8e6;border:1px solid var(--orange);color:#7a4300;font-size:13px;padding:8px 14px;border-radius:8px;margin-bottom:22px}

footer a[href]{display:inline}
.cbox a{color:var(--blue);font-weight:600}

.mis{margin:6px 0 0;padding-left:22px}.mis li{margin-bottom:10px}.mis li::marker{color:var(--orange);font-weight:700}

.orgbox{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff;cursor:zoom-in}.orgbox img{display:block;width:100%;min-width:900px;height:auto}.lb .in.wide{width:min(1300px,100%)}

.ccards{display:grid;gap:20px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.cc{background:var(--bg2);border-radius:14px;padding:22px}
.ico{width:46px;height:46px;border-radius:50%;background:#fff;color:var(--navy);display:inline-flex;align-items:center;justify-content:center;font:700 15px Poppins;text-decoration:none;margin:0 6px 6px 0}
.socs a.ico:hover{background:var(--orange);color:#fff}
.cl{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-top:14px}
.cv{font:600 20px Poppins;color:var(--navy);margin-top:4px;word-break:break-word}.cv a{color:var(--navy);text-decoration:none}
.hq{display:grid;gap:28px;grid-template-columns:1fr 1.4fr 1fr;align-items:start}.hq h2{margin:0}.hq p{margin:6px 0 0}
@media(max-width:760px){.hq{grid-template-columns:1fr;gap:16px}}

.logo{display:flex;align-items:center;gap:10px}.logo img{height:38px;width:auto;background:#fff;padding:3px 8px;border-radius:8px;display:block}
.simtag{font:600 11px Inter;color:#fff;background:var(--orange);padding:3px 8px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase}
.flogo{height:40px;width:auto;background:#fff;padding:3px 8px;border-radius:8px;display:block;margin-bottom:12px}
.ico svg{display:block}
.hq a{color:var(--blue);font-weight:600}.hq a:hover{color:var(--orange)}
.logo .simtag{color:#fff}
a.map{transition:.2s;font-weight:600}a.map:hover{color:var(--navy);box-shadow:0 6px 18px rgba(20,43,69,.15)}

const U=DATA.ui, T=o=>o&&typeof o==="object"&&("id" in o)?o[lang]:o;
const ph=(c,label,img)=>img?`<div class="ph"><img src="${img}" style="width:100%;height:100%;object-fit:cover" alt="${label||""}">${label?`<small>${label}</small>`:""}</div>`:
 `<div class="ph ${c}"><svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="3"><rect x="14" y="8" width="36" height="38" rx="8"/><rect x="19" y="14" width="26" height="14" rx="3"/><circle cx="23" cy="38" r="2.5" fill="#fff"/><circle cx="41" cy="38" r="2.5" fill="#fff"/><path d="M20 56l6-10M44 56l-6-10"/></svg><small>${label||"Foto placeholder"}</small></div>`;
const hl=s=>String(s).replace(/(\[[^\]]+\])/g,'<span class="ph-txt">$1</span>');
const ext=u=>/^https?:/.test(u)?`href="${u}" target="_blank" rel="noopener"`:`href="${u}"`;

function svcCard(s){return `<div class="card">${ph(s.c,"",s.img)}<div class="b"><span class="tag">${T(DATA.whoLabel[s.who])}</span><h3 style="font-size:18px">${T(s.t)}</h3><p>${hl(T(s.d))}</p><a class="btn s" ${ext(s.url)}>${T(U.detail)} →</a></div></div>`}
function newsCard(n){return `<div class="card">${ph(n.c,"",n.img)}<div class="b"><div class="meta">${hl(n.date)} · ${T(DATA.info.cats[n.cat])} · <b style="color:var(--orange)">${n.src?(lang==="id"?"Sumber: ":"Source: ")+n.src:T(U.sim)}</b></div><h3 style="font-size:17px">${T(n.t)}</h3><p>${T(n.d)}</p><a class="btn s" ${ext(n.url)}>${T(U.more)} →</a></div></div>`}
function head(t){return `<div class="pagehead"><div class="wrap"><h1>${T(t)}</h1></div></div>`}
function photoGrid(list){return `<div class="grid">${list.map(([k,c,img],i)=>`<div class="card photo" onclick="openLb(${DATA.gallery.photos.findIndex(p=>p===list[i])})">${ph(c,T(DATA.gallery.cats[k]),img)}</div>`).join("")}</div>`}
function tabs(map,key,fn){return `<div class="tabs"><button class="${cat[key]==="all"?"on":""}" onclick="${fn}('all')">${T(U.all)}</button>${Object.entries(map).map(([k,v])=>`<button class="${cat[key]===k?"on":""}" onclick="${fn}('${k}')">${T(v)}</button>`).join("")}</div>`}

<section><div class="wrap"><h2>${T(A.valT)}</h2><div class="vals">${A.values.map(v=>`<div class="val"><b>${v[0]}</b><br><span style="font-size:14px;color:var(--muted)">${T(v[1])}</span></div>`).join("")}</div></div></section>`},

services:()=>head(DATA.servicesPage.t)+`<section><div class="wrap"><div class="grid">${DATA.services.map(svcCard).join("")}</div></div></section>`,

info:()=>{const I=DATA.info;const list=DATA.news.filter(n=>cat.news==="all"||n.cat===cat.news);return head(I.title)+`
<section><div class="wrap"><h2>${T(I.svcT)}</h2><div class="grid">${I.svc.map(s=>`<div class="card"><div class="b"><h3 style="font-size:17px">${T(s.t)}</h3><p>${hl(T(s.d))}</p><a class="btn s" ${ext("https://www.kai.id")}>${T(U.detail)} →</a></div></div>`).join("")}</div></div></section>
<section class="alt"><div class="wrap"><h2>${T(I.newsT)}</h2>${tabs(I.cats,"news","setNews")}<div class="grid">${list.map(newsCard).join("")}</div></div></section>`},

gallery:()=>{const G=DATA.gallery;const ps=G.photos.filter(p=>cat.photo==="all"||p[0]===cat.photo);const vs=G.videos.filter(v=>cat.video==="all"||v[0]===cat.video);return head(G.title)+`
<section><div class="wrap"><h2>${T(G.photoT)}</h2>${tabs(G.cats,"photo","setPhoto")}${photoGrid(ps)}</div></section>
<section class="alt"><div class="wrap"><h2>${T(G.videoT)}</h2>${tabs(G.vcats,"video","setVideo")}<div class="grid">${vs.map(([k,id])=>`<div class="card"><div class="vid">${id?`<iframe src="https://www.youtube.com/embed/${id}" allowfullscreen loading="lazy"></iframe>`:T(U.soon)}</div><div class="b"><h3 style="font-size:16px">${T(G.vcats[k])}</h3></div></div>`).join("")}</div></div></section>`},

org:()=>{const O=DATA.org;return head(O.title)+`<section><div class="wrap"><div class="orgbox" onclick="openOrg()"><img src="${O.img}" alt="${T(O.alt)}"></div><p class="meta" style="margin-top:10px">${T(O.hint)}</p></div></section>`},

contact:()=>{const C=DATA.contact;const ic=(t)=>`<span class="ico">${t}</span>`;
const card=(i,l,v)=>`<div class="cc">${ic(i)}<div class="cl">${T(l)}</div><div class="cv">${v}</div></div>`;
return head(C.title)+`<section><div class="wrap"><div class="ccards">
${card("☎",C.cc.l,C.cc.v)}${card("✆",C.wa.l,`<a href="${C.wa.url}" target="_blank" rel="noopener">${C.wa.v}</a>`)}${card("✉",C.mail.l,C.mail.v)}
<div class="cc"><div class="socs">${C.soc.links.map(s=>`<a class="ico" href="${s[2]}" target="_blank" rel="noopener" title="${s[1]}" aria-label="${s[1]}">${SVG[s[0]]}</a>`).join("")}</div><div class="cl">${T(C.soc.l)}</div><div class="cv">${C.soc.v}</div></div>
</div>
<hr style="border:0;border-top:1px solid var(--line);margin:40px 0">
<div class="hq"><h2>${T(C.hqT)}</h2><div><div class="cl">${T(C.addrL)}</div><p>${T(C.addr.v)}</p></div><div><div class="cl">${T(C.telL)}</div><p>${C.tel}</p></div></div>
<p style="display:flex;gap:10px;flex-wrap:wrap;margin:26px 0"><a class="btn o" ${ext(C.web.v)}>${T(C.visit)}</a><a class="btn" ${ext(C.wa.url)}>${T(C.call)}</a><a class="btn o" ${ext(C.maps.url)}>📍 ${T(C.maps.open)}</a></p>
<div class="map" style="padding:0;overflow:hidden"><iframe src="${C.maps.embed}" title="${T(U.mapPh)}" style="width:100%;height:100%;border:0" loading="lazy" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe></div></div></section>`}
};

function renderNav(){document.getElementById("nav").innerHTML=DATA.nav.map(([k,l])=>`<a class="${cur===k?"on":""}" onclick="go('${k}')">${T(l)}</a>`).join("");
 document.getElementById("l-id").className=lang==="id"?"on":"";document.getElementById("l-en").className=lang==="en"?"on":""}
function renderFoot(){const C=DATA.contact;document.getElementById("foot").innerHTML=`<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
<div><img class="flogo" src="${DATA.logo}" alt="KAI"><h4>PT Kereta Api Indonesia (Persero)</h4><p>${T(DATA.intro.p).slice(0,110)}…</p></div>
<div><h4>${T(U.quick)}</h4>${DATA.nav.map(([k,l])=>`<a onclick="go('${k}')">${T(l)}</a>`).join("")}</div>
<div><h4>${T(U.contact)}</h4><div>${hl(T(C.addr.v))}</div><div>${C.cc.v}</div><div>${C.tel}</div><div>${hl(T(C.mail.v))}</div></div>
<div><h4>${T(U.social)}</h4><div>${C.soc.v}</div></div></div><div class="disc">${T(U.disclaimer)}</div>`}
function render(){document.documentElement.lang=lang;renderNav();renderFoot();
 const app=document.getElementById("app");app.innerHTML=`<div class="page on">${PAGES[cur]()}</div>`;
 document.getElementById("nav").classList.remove("open")}
function go(p){if(!PAGES[p])p="home";cur=p;try{history.replaceState(null,"","#"+p)}catch(e){}render();scrollTo({top:0,behavior:"instant"})}
function setLang(l){lang=l;try{localStorage.setItem("kai-lang",l)}catch(e){}render()}
function setPhoto(k){cat.photo=k;render()} function setVideo(k){cat.video=k;render()} function setNews(k){cat.news=k;render()}
function openOrg(){const b=document.getElementById("lbin");b.classList.add("wide");b.innerHTML=`<div style="overflow:auto;max-height:86vh;background:#fff;border-radius:10px"><img src="${DATA.org.img}" alt="" style="display:block;min-width:1100px;width:100%"></div>`;document.getElementById("lb").classList.add("on")}
function openLb(i){document.getElementById("lbin").classList.remove("wide");const p=DATA.gallery.photos[i];document.getElementById("lbin").innerHTML=ph(p[1],"",p[2])+`<p>${T(DATA.gallery.cats[p[0]])}</p>`;document.getElementById("lb").classList.add("on")}
addEventListener("scroll",()=>{document.getElementById("top").style.display=scrollY>400?"block":"none"});
addEventListener("hashchange",()=>{const h=location.hash.slice(1);if(h&&h!==cur){cur=PAGES[h]?h:"home";render()}});
cur=PAGES[location.hash.slice(1)]?location.hash.slice(1):"home";render();
</script>
</body>
</html>
